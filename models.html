<div class="stars-bg"><div class="star gold"></div><div class="star gold"></div><div class="star gold"></div><div class="star gold"></div><div class="star teal"></div><div class="star teal"></div><div class="star teal"></div><div class="star teal"></div><div class="star blue"></div><div class="star blue"></div><div class="star blue"></div><div class="star blue"></div><div class="star white"></div><div class="star white"></div><div class="star white"></div><div class="star trail gold"></div><div class="star trail teal"></div><div class="star trail teal"></div><div class="star trail blue"></div><div class="star trail gold"></div></div>
<!-- NAV: Injected by nav.js -->
<div id="nav-container" data-active-page="models"></div>

<div class="models-page"><div class="container">
      <div class="models-header"><span class="section-label">Models</span><h2 class="section-title">Models</h2><p class="section-sub">All models with pricing & version info. <span id="modelCount"></span></p></div>
      <div class="models-toolbar">
        <input type="text" id="modelSearch" placeholder="Search by name, ID, or provider..." oninput="filterModelCards()">
        <select id="providerFilter" onchange="filterModelCards()"><option value="">All Providers</option></select>
        <button class="sort-btn" onclick="toggleModelSort()" id="sortBtn">↓ Price</button>
      </div>
      <div class="cat-pills" id="catPills">
        <span class="cat-pill active" data-cat="" onclick="filterByCategory(this)">All</span>
      </div>
      <div id="modelGrid" class="model-grid"><div class="loading-dots"><span></span><span></span><span></span></div></div>
    </div></div>

  <!-- LOGIN -->
<!-- FOOTER: Injected by footer.js -->
<div id="footer-container"></div>

<button class="chat-fab" onclick="toggleChat()">💬</button>
  <div class="chat-window" id="chatWindow">
    <div class="chat-header"><h3>💬 Support</h3><button id="chatStaticClose" onclick="toggleChat()">✕</button></div>
    <div class="chat-msgs" id="chatMsgs">
      <div class="chat-msg ai"><div class="av">🤖</div><div class="bubble">Hi! I'm the GlbTOKEN assistant. Ask me about buying tokens, AI models, payments, or API keys.</div>  </div>
    </div>
    <div class="chat-input">
      <textarea id="chatInput" placeholder="Send a message..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMsg()}"></textarea>
      <button type="button" id="chatSendBtn" onclick="sendChatMsg()" onmousedown="event.preventDefault()">➤</button>
    </div>
  </div>

<script src="nav.js?v=1"></script>
<script src="footer.js?v=1"></script>
<script src="translations.js?v=1086"></script>
<script src="secure_storage.js"></script>
<script data-cfasync="false" src="shared.js?v=1106"></script>
<script data-cfasync="false" src="user.js?v=1105"></script>
<script data-cfasync="false" src="ui.js?v=1116"></script>

<script>
(function(){
  var cw = document.getElementById('chatWindow');
  if(!cw) return;
  var h = cw.querySelector('.chat-header');
  if(!h) return;
  var offX, offY, dragging = false;
  function startDrag(e){
    if(e.target.tagName === 'BUTTON') return;
    dragging = true; cw.classList.add('dragging');
    var r = cw.getBoundingClientRect();
    var cx = e.clientX || (e.touches && e.touches[0].clientX);
    var cy = e.clientY || (e.touches && e.touches[0].clientY);
    offX = cx - r.left; offY = cy - r.top;
    e.preventDefault();
  }
  function moveDrag(e){
    if(!dragging) return;
    var cx = e.clientX || (e.touches && e.touches[0].clientX);
    var cy = e.clientY || (e.touches && e.touches[0].clientY);
    cw.style.left = (cx - offX) + 'px';
    cw.style.top = (cy - offY) + 'px';
    cw.style.right = 'auto'; cw.style.bottom = 'auto';
  }
  function endDrag(){if(dragging){dragging=false;cw.classList.remove('dragging')}}
  h.addEventListener('mousedown', startDrag);
  h.addEventListener('touchstart', startDrag, {passive:false});
  document.addEventListener('mousemove', moveDrag);
  document.addEventListener('touchmove', moveDrag, {passive:false});
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchend', endDrag);
})();
</script>

</body>
</html>
