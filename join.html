<script>
// ── Join organization via invite link ──
(function(){
  var params = new URLSearchParams(window.location.search);
  // URL params win; fall back to the pending invite stashed before login
  // (afterLoginRedirect() lands here WITHOUT ?org=&token= — the stash is
  // the only way the invite survives the auth round-trip)
  var orgId = params.get('org') || sessionStorage.getItem('gt_pending_org');
  var inviteToken = params.get('token') || sessionStorage.getItem('gt_pending_token');
  var statusEl = document.getElementById('joinStatus');
  var actionsEl = document.getElementById('joinActions');

  // Remember the pending invite so it survives login/registration
  try{
    sessionStorage.setItem('gt_pending_org', orgId || '');
    sessionStorage.setItem('gt_pending_token', inviteToken || '');
  }catch(e){}

  if(!orgId || !inviteToken){
    statusEl.textContent = 'This invite link is incomplete or expired.';
    actionsEl.innerHTML = '<a class="btn-action" href="team.html">Go to Team</a>';
    return;
  }

  function render(html, actions){
    statusEl.innerHTML = html;
    actionsEl.innerHTML = actions;
  }

  async function doJoin(){
    if(!token){
      render('Sign in to accept this invitation. New here? Create a free account — you\'ll be added right after.',
        '<a class="btn-action" href="login.html">Sign In</a>'
        + '<a class="btn-secondary" href="register.html">Create Account</a>');
      return;
    }
    render('Accepting invitation…', '');
    var d = await safeApi('POST','/api/orgs/'+encodeURIComponent(orgId)+'/join',{token: inviteToken}, 15000, true);
    if(d && d.status === 'joined'){
      render('✅ You joined <strong>'+escapeHtml(d.org_name || 'the organization')+'</strong> as a member!',
        '<a class="btn-action" href="team.html">Go to Team</a>');
      try{ sessionStorage.removeItem('gt_pending_org'); sessionStorage.removeItem('gt_pending_token'); }catch(e){}
    } else if(d && d.detail){
      var msg = d.detail;
      render('⚠️ '+escapeHtml(msg),
        '<a class="btn-action" href="team.html">Go to Team</a>');
    } else {
      render('Something went wrong. Please try again.',
        '<button class="btn-action" onclick="location.reload()">Retry</button>');
    }
  }

  // If user lands here after login/registration, auto-accept (token restored by shared.js)
  doJoin();
})();
</script>
